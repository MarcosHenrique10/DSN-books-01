  <img src="images/016.jpg" alt="" />  <div class="text-frame" style="left:154px; top:116px; width:437px; height:132px;">    <p>      <span class="font-5">        <span id="w322">	The</span>        <span id="w323">pups</span>        <span id="w324">were</span>        <span id="w325">in</span>        <span id="w326">luck:</span>        <span id="w327">the</span>        <span id="w328">back</span>        <span id="w329">door</span>        <span id="w330">was</span>        <span id="w331">ajar.</span>      </span>    </p>    <p>      <span class="font-5">	</span>      <span class="font-9">        <span id="w332">&#8220;He&#8217;s</span>        <span id="w333">headed</span>        <span id="w334">toward</span>        <span id="w335">the</span>        <span id="w336">courtyard,&#8221;</span>      </span>      <span class="font-5">        <span id="w337">said</span>        <br/>        <span id="w338">Patch.</span>      </span>      <span class="font-9">        <span id="w339">&#8220;We</span>        <span id="w340">can&#8217;t</span>        <span id="w341">lose</span>        <span id="w342">him,</span>        <span id="w343">men!&#8221;</span>      </span>      <span class="font-5">&#160;</span>    </p>    <p>      <span class="font-5">        <span id="w344">	While</span>        <span id="w345">the</span>        <span id="w346">puppies</span>        <span id="w347">searched</span>        <span id="w348">for</span>        <span id="w349">the</span>        <span id="w350">scoundrel,</span>        <br/>        <span id="w351">Rolly</span>        <span id="w352">decided</span>        <span id="w353">to</span>        <span id="w354">search</span>        <span id="w355">for</span>        <span id="w356">a</span>        <span id="w357">snack.</span>      </span>    </p>  </div><span id="empty"></span></div>
