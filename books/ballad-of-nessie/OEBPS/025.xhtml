<div class="page25_item1">
<p class="nonindent2"><span class="white"><span id="w412">She</span> 
<span id="w413">cried</span> 
<span class="bold"><span id="w414">tubs</span></span> 
<span id="w415">and</span> 
<span id="w416"><span class="bold">barrels</span>,</span></span></p>
<p class="nonindent2"><span class="white"><span class="bold"><span id="w417">quintets</span></span> 
<span id="w418">and</span> 
<span id="w419"><span class="bold">quintuplets</span>!</span></span></p>
</div>
<div class="page25_item2">
<p class="nonindent2"><span class="white"><span id="w420">For</span> 
<span class="bold"><span id="w421">days</span></span> 
<span id="w422">Nessie</span> 
<span id="w423">cried.</span></span></p>
<p class="nonindent2"><span class="white"><span id="w424">Nay,</span> 
<span id="w425">for</span> 
<span class="bold"><span id="w426">weeks</span></span> 
<span id="w427">on</span> 
<span id="w428">it</span> 
<span id="w429">went&#x00A0;.&#x00A0;.&#x00A0;.</span></span></p>
