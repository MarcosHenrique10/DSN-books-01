<p class="nonindent2"><span id="w458">Nay,</span> 
<span class="bold"><span id="w459">&#x2019;twas</span> 
<span id="w460">a</span></span> 
<span id="w461"><span class="bold">loch</span>!</span></p>
<p class="nonindent2"><span id="w462">Nessie</span> 
<span id="w463">gasped</span> 
<span id="w464">in</span> 
<span id="w465">delight!</span></p>
<p class="nonindent2"><span id="w466">Surely,</span> 
<span class="bold"><span id="w467">&#x2019;twas</span></span> 
<span id="w468"><span class="bold">paradise</span>,</span></p>
<p class="nonindent2"><span id="w469">with</span> 
<span id="w470">no</span> 
<span id="w471">golf</span> 
<span id="w472">tee</span>
