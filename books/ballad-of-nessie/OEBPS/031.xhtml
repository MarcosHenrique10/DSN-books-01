<p class="nonindent2"><span id="w496">Dinna</span> 
<span id="w497">be</span> 
<span id="w498">afraid</span> 
<span id="w499">to</span> 
<span id="w500">cry;</span></p>

<span id="w507">through</span> 
<span id="w508">our</span> 
<span id="w509">tears</span></p>

<span id="w511">we</span>
